<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptify - Real-Time Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container text-center mt-5">
    <h1>Aptify - Real-Time People and Noise Detection</h1>
    <div class="row">
        <div class="col-md-8">
            <img id="detectionFrame" src="/stream" alt="Live Detection Stream" class="img-fluid border">
        </div>
        <div class="col-md-4">
            <div id="stats" class="mt-3">
                <p><strong>People Count:</strong> <span id="peopleCount">0</span></p>
                <p><strong>Noise Level:</strong> <span id="noiseLevel">0.0000 dB</span></p>
                <p><strong>Environment:</strong> <span id="noiseStatus" class="badge">Listening...</span></p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/script.js"></script>
<script>
    function updateDisplay(data) {
        document.getElementById('peopleCount').textContent = data.peopleCount;
        document.getElementById('noiseLevel').textContent = data.noiseLevel.toFixed(4) + ' dB';
        const noiseStatus = document.getElementById('noiseStatus');
        if (data.isNoisy) {
            noiseStatus.textContent = 'Noisy';
            noiseStatus.className = 'badge bg-danger';
        } else {
            noiseStatus.textContent = 'Quiet';
            noiseStatus.className = 'badge bg-success';
        }
    }

    const source = new EventSource('/events');
    source.onmessage = function(event) {
        const data = JSON.parse(event.data);
        updateDisplay(data);
        console.log('Received detection data:', data);
    };
    source.onerror = function() {
        console.error('SSE error, retrying...');
        document.getElementById('noiseStatus').textContent = 'Error';
        document.getElementById('noiseStatus').className = 'badge bg-warning';
    };
</script>
</body>
</html>
